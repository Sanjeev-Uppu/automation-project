# Production-style run:  docker compose up --build -d
# Requires backend/.env (copy from backend/.env.example and fill in the three Jira values).
# Terminate HTTPS in front of this stack (reverse proxy / load balancer) for real deployments.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      APP_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
